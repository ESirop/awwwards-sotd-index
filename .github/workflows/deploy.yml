name: Deploy

# Awwwards blocks GitHub's servers, so data is refreshed locally with `npm run update`,
# which commits and pushes data/. Every push to main redeploys the page.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write # required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r assets _site/
          cp data/sotd.js _site/data/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
