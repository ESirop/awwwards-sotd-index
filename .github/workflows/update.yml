name: Update data and deploy

on:
  push:
    branches: [main]
  # Daily at 11:00 Paris time, once the new Site of the Day is out. Cron runs in UTC, so both
  # 09:05 and 10:05 UTC are scheduled and the gate job keeps the one that falls at 11:xx in Paris
  # (09:05 in summer, 10:05 in winter).
  schedule:
    - cron: '5 9 * * *'
    - cron: '5 10 * * *'
  workflow_dispatch:

# Nothing by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=Europe/Paris date +%H)" = "11" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not 11:xx in Paris ($(TZ=Europe/Paris date +%H:%M)), skipping."
          fi

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # commit the refreshed data
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Daily runs only fetch what is new. On the 1st of the month, every listing is walked again.
      - name: Scrape
        run: node scripts/scrape.mjs $([ "$(date -u +%d)" = "01" ] && echo --full)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898213+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update data $(date -u +%F)"
          git push

  deploy:
    needs: [gate, update]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' && needs.update.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write # required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r assets _site/
          cp data/sotd.js _site/data/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
