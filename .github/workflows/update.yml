name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *' # daily, after the new Site of the Day is out
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Daily runs only fetch what is new. On the 1st of the month, every listing is walked again.
      - name: Scrape
        run: node scripts/scrape.mjs $([ "$(date -u +%d)" = "01" ] && echo --full)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898213+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update data $(date -u +%F)"
          git push

  deploy:
    needs: update
    if: ${{ !cancelled() && needs.update.result != 'failure' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/sotd.js _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
